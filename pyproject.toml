[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuvimage"
version = "0.1.0"
description = "Easy image reconstruction of radio interferometric data by forward modelling in the uv-plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hannah Stacey" }]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "autogalaxy",
    # autoarray's non-negative solver is built on numba kernels; without it
    # they run as pure Python and every positive-only solve is several times
    # slower (see docs/install.md)
    "numba",
]

[project.optional-dependencies]
# Reading CASA measurement sets directly (Linux / macOS):
ms = ["python-casacore"]
# JAX acceleration (strongly recommended for > ~10^4 visibilities):
jax = ["jax", "nufftax>=0.6.1,<0.7.0"]
# autoarray's development head: the in-place non-negative solver and its
# cross-fit warm-start memo (Sep 2026) are not in a release yet, and the
# version string was not bumped, so `pip install -U autoarray` will not see
# them. Until the next release: pip install -e ".[autoarray-main]"
autoarray-main = ["autoarray @ git+https://github.com/PyAutoLabs/PyAutoArray"]

[project.scripts]
pyuvimage = "pyuvimage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
