[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuvimage"
version = "0.1.0"
description = "Easy image reconstruction of radio interferometric data by forward modelling in the uv-plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hannah Stacey" }]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    # PyAutoLabs releases in lockstep; 2026.10.2.1 is the first with both the
    # streaming accumulation the streamed path uses (`sparse_terms_from_chunks`)
    # and the in-place non-negative solver with its warm-start memo (J0116
    # solves 72-109 s -> 1-2 s). See docs/install.md.
    "autogalaxy>=2026.10.2.1",
    "autoarray>=2026.10.2.1",
    # the same solver's Cholesky-update kernels are numba; without it they run
    # as pure Python and every positive-only solve is several times slower
    "numba",
]

[project.optional-dependencies]
# Reading CASA measurement sets directly (Linux / macOS):
ms = ["python-casacore"]
# JAX acceleration (strongly recommended for > ~10^4 visibilities):
jax = ["jax", "nufftax>=0.6.1,<0.7.0"]

[project.scripts]
pyuvimage = "pyuvimage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
