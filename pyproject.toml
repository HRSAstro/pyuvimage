[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuvimage"
version = "0.1.0"
description = "Easy image reconstruction of radio interferometric data by forward modelling in the uv-plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hannah Stacey" }]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "autogalaxy",
    # autoarray's development head: the in-place non-negative solver and its
    # cross-fit warm-start memo (Sep 2026) took a J0116 fit's solves from
    # 72-109 s to 1-2 s. Not in a release yet and the version string was not
    # bumped, so it has to come from git (see docs/install.md).
    "autoarray @ git+https://github.com/PyAutoLabs/PyAutoArray",
    # the same solver's Cholesky-update kernels are numba; without it they run
    # as pure Python and every positive-only solve is several times slower
    "numba",
]

[project.optional-dependencies]
# Reading CASA measurement sets directly (Linux / macOS):
ms = ["python-casacore"]
# JAX acceleration (strongly recommended for > ~10^4 visibilities):
jax = ["jax", "nufftax>=0.6.1,<0.7.0"]

[project.scripts]
pyuvimage = "pyuvimage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
