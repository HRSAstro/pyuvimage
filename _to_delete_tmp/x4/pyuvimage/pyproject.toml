[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuvimage"
version = "0.1.0"
description = "Easy image reconstruction of radio interferometric data by forward modelling in the uv-plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hannah Stacey" }]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "autogalaxy",
]

[project.optional-dependencies]
# Reading CASA measurement sets directly (Linux / macOS):
ms = ["python-casacore"]
# JAX acceleration (strongly recommended for > ~10^4 visibilities):
jax = ["jax", "nufftax>=0.6.1,<0.7.0"]

[project.scripts]
pyuvimage = "pyuvimage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
